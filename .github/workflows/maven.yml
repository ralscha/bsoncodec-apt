name: test

on: [push]

jobs:
  test:
    strategy:
       matrix:
         java: [17, 21, 25]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Maven Install and Test
      run: |
         ./mvnw clean install
         cd test
         ../mvnw clean test
